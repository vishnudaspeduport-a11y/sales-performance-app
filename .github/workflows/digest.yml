# Morning pending-tasks digest: one email / WhatsApp message per manager plus an all-teams
# summary, built from the latest dashboard snapshot. Runs at 09:00 IST every day (after the
# 05:30 IST sync) and on demand from the Actions tab.
#
# Secrets (repo → Settings → Secrets and variables → Actions):
#   DIGEST_RECIPIENTS   JSON list, e.g. [{"team":"Team Aswanth","email":"a@eduport.ai"},{"team":"*","email":"head@eduport.ai"}]
#                       (add "whatsapp":"91XXXXXXXXXX" to an entry to also send on WhatsApp)
#   SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASS, DIGEST_FROM   email account that sends the digest
#   WHATSAPP_TOKEN, WHATSAPP_PHONE_ID                          optional, WhatsApp Cloud API
# Variables (optional): DASHBOARD_URL, DIGEST_TARGET (overdue per executive, default 5)
name: Pending tasks digest

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Render the messages as files without sending (true/false)'
        required: false
        default: 'false'

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev --ignore-scripts
      - name: Build and send the digest
        env:
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          DIGEST_TARGET: ${{ vars.DIGEST_TARGET }}
          DIGEST_RECIPIENTS: ${{ secrets.DIGEST_RECIPIENTS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          DIGEST_FROM: ${{ secrets.DIGEST_FROM }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_ID: ${{ secrets.WHATSAPP_PHONE_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/pending-digest.mjs ${{ github.event.inputs.dry_run == 'true' && '--dry-run --out digest-preview' || '' }}
      - name: Keep the rendered messages (dry run only)
        if: github.event.inputs.dry_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digest-preview
          path: digest-preview
          retention-days: 7
