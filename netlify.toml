[build]
  command = "npm run build"
  publish = "dist"
  # Skip the build (saves Netlify credits) when a push only touches docs, SQL migrations,
  # local scripts or CI config — nothing the deployed site uses.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)README.md' ':(exclude)supabase' ':(exclude)scripts' ':(exclude).github' ':(exclude).env.example'"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Single-page app: every non-API path serves index.html (hash routing is used in-app).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  conditions = { Path = "!/api/*" }

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
