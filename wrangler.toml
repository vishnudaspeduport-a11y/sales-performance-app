# Cloudflare Workers: the built dashboard as static assets plus the small /api worker.
# Deploy: `npm run build` then `npx wrangler deploy` (or connect the GitHub repo under
# Workers & Pages → Create → Import a repository, build command `npm run build`,
# deploy command `npx wrangler deploy`).
name = "eduportsales"
main = "worker/index.mjs"
compatibility_date = "2026-09-01"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[vars]
GITHUB_REPO = "vishnudaspeduport-a11y/sales-performance-app"
GITHUB_BRANCH = "main"
SYNC_WORKFLOW = "sync.yml"
CACHE_SECONDS = "300"

[observability]
enabled = true
